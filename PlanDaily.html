    trigger.innerHTML = '<span class="ct-val"></span><span class="ct-icon">🕐</span>';

    var dd = document.createElement('div');
    dd.className = 'custom-time-dropdown';
    dd._origParent = wrap;
    dd.innerHTML = '<div class="ct-cols"><div class="ct-col"><div class="ct-col-label">Час</div><div class="ct-list" id="ct-hours"></div></div><div class="ct-col"><div class="ct-col-label">Мин</div><div class="ct-list" id="ct-mins"></div></div></div>';

    var hoursList = dd.querySelector('#ct-hours');
    var minsList = dd.querySelector('#ct-mins');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function build() {
      hoursList.innerHTML = '';
      minsList.innerHTML = '';
      for (var h = 0; h < 24; h++) {
        var el = document.createElement('div');
        el.className = 'ct-item' + (h === curH ? ' selected' : '');
        el.textContent = pad(h);
        el.dataset.h = h;
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          curH = parseInt(this.dataset.h);
          sync();
        });
        hoursList.appendChild(el);
      }
      for (var m = 0; m < 60; m++) {
        var el = document.createElement('div');
        el.className = 'ct-item' + (m === curM ? ' selected' : '');
        el.textContent = pad(m);
        el.dataset.m = m;
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          curM = parseInt(this.dataset.m);
          sync();
          closeDropdown(dd, wrap, input.closest('.fg'));
        });
        minsList.appendChild(el);
      }
      var selH = hoursList.querySelector('.selected');
      if (selH) selH.scrollIntoView({ block: 'center' });
      var selM = minsList.querySelector('.selected');
      if (selM) selM.scrollIntoView({ block: 'center' });
    }

    var curH = 9, curM = 0;

    function sync() {
      if (curH > 23) curH = 0;
      if (curH < 0) curH = 23;
      if (curM > 59) curM = 0;
      if (curM < 0) curM = 59;
      var val = pad(curH) + ':' + pad(curM);
      input.value = val;
      trigger.querySelector('.ct-val').textContent = val;
      Array.from(hoursList.children).forEach(function(el) { el.classList.toggle('selected', parseInt(el.dataset.h) === curH); });
      Array.from(minsList.children).forEach(function(el) { el.classList.toggle('selected', parseInt(el.dataset.m) === curM); });
    }

    var _scrub = null;
    var _scrubMoved = false;

    trigger.addEventListener('click', function(e) {
      if (_scrubMoved) { _scrubMoved = false; return; }
      e.stopPropagation();
      if (dd.classList.contains('open')) { closeDropdown(dd, wrap, input.closest('.fg')); return; }
      var parts = (input.value || '09:00').split(':');
      curH = parseInt(parts[0]) || 0;
      curM = parseInt(parts[1]) || 0;
      build();
      openDropdown(trigger, dd);
      wrap.classList.add('open');
      input.closest('.fg')?.classList.add('fg-open');
    });

    trigger.addEventListener('mousedown', function(e) {
      _scrub = { startY: e.clientY, h: curH, m: curM };
      _scrubMoved = false;
    });

    document.addEventListener('mousemove', function(e) {
      if (!_scrub) return;
      var dy = e.clientY - _scrub.startY;
      if (!_scrubMoved && Math.abs(dy) > 3) {
        _scrubMoved = true;
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
      }
      if (!_scrubMoved) return;
      e.preventDefault();
      var delta = Math.round((_scrub.startY - e.clientY) / 5);
      var total = (_scrub.h * 60 + _scrub.m) + delta;
      total = Math.max(0, Math.min(1439, total));
      curH = Math.floor(total / 60);
      curM = total % 60;
      sync();
    });

    document.addEventListener('mouseup', function() {
      if (!_scrub) return;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      if (_scrubMoved) {
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
      _scrub = null;
    });

    trigger.addEventListener('touchstart', function(e) {
      _scrub = { startY: e.touches[0].clientY, h: curH, m: curM };
      _scrubMoved = false;
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!_scrub) return;
      var ty = e.touches[0].clientY;
      var dy = ty - _scrub.startY;
      if (!_scrubMoved && Math.abs(dy) > 5) {
        _scrubMoved = true;
      }
      if (!_scrubMoved) return;
      e.preventDefault();
      var delta = Math.round((_scrub.startY - ty) / (window.innerWidth < 768 ? 3 : 5));
      var total = (_scrub.h * 60 + _scrub.m) + delta;
      total = Math.max(0, Math.min(1439, total));
      curH = Math.floor(total / 60);
      curM = total % 60;
      sync();
    }, { passive: false });

    document.addEventListener('touchend', function() {
      if (!_scrub) return;
      if (_scrubMoved) {
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
      _scrub = null;
    });

    wrap.addEventListener('wheel', function(e) {
      if (!e.target.closest('.custom-time-trigger')) return;
      e.preventDefault();
      e.stopPropagation();
      var step = e.shiftKey ? 15 : 1;
      var total = curH * 60 + curM + (e.deltaY > 0 ? -step : step);
      total = Math.max(0, Math.min(1439, total));
      curH = Math.floor(total / 60);
      curM = total % 60;
      sync();
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }, { passive: false, capture: true });

    document.addEventListener('click', function() { closeDropdown(dd, wrap, input.closest('.fg')); });

    wrap.appendChild(trigger);
    wrap.appendChild(dd);
    input.style.position = 'absolute'; input.style.opacity = '0';
    input.style.width = '0'; input.style.height = '0'; input.style.pointerEvents = 'none';
    sync();
  }

  // ==== Custom Date Picker ====
  function createCustomDate(id) {
    var input = document.getElementById(id);
    if (!input) return;
    var wrap = document.createElement('div');
    wrap.className = 'custom-date';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    var trigger = document.createElement('div');
    trigger.className = 'custom-date-trigger';
    trigger.innerHTML = '<span class="cd-val"></span><span class="ct-icon">📅</span>';

    var dd = document.createElement('div');
    dd.className = 'custom-date-dropdown';
    dd._origParent = wrap;

    var viewYear, viewMonth;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function getTaskDates() {
      var dates = {};
      tasks.forEach(function(t) { dates[t.date] = true; });
      return dates;
    }

    function build() {
      var taskDates = getTaskDates();
      var now = new Date();
      var todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
      var selectedDate = input.value || todayStr;

      var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      var dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

      var first = new Date(viewYear, viewMonth, 1);
      var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      var startDow = first.getDay() || 7; // Mon=1 ... Sun=7

      var html = '';
      html += '<div class="cd-header">' +
        '<button class="cd-nav" data-dir="-1">◀</button>' +
        '<span class="cd-month">' + months[viewMonth] + ' ' + viewYear + '</span>' +
        '<button class="cd-nav" data-dir="1">▶</button>' +
        '</div>';

      html += '<div class="cd-days">';
      dows.forEach(function(d) { html += '<div class="cd-dow">' + d + '</div>'; });

      for (var i = 1; i < startDow; i++) {
        html += '<div class="cd-day other"></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(d);
        var cls = 'cd-day';
        if (dateStr === todayStr) cls += ' today';
        if (dateStr === selectedDate) cls += ' selected';
        if (taskDates[dateStr]) cls += ' has-tasks';
        html += '<div class="' + cls + '" data-date="' + dateStr + '">' + d + '</div>';
      }
      html += '</div>';

      dd.innerHTML = html;

      dd.querySelectorAll('.cd-nav').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          viewMonth += parseInt(this.dataset.dir);
          if (viewMonth > 11) { viewMonth = 0; viewYear++; }
          if (viewMonth < 0) { viewMonth = 11; viewYear--; }
          build();
        });
      });

      dd.querySelectorAll('.cd-day:not(.other)').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          input.value = this.dataset.date;
          trigger.querySelector('.cd-val').textContent = formatDateLabel(input.value);
          input.dispatchEvent(new Event('change', { bubbles: true }));
          closeDropdown(dd, wrap, input.closest('.fg'));
        });
      });
    }

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      if (dd.classList.contains('open')) { closeDropdown(dd, wrap, input.closest('.fg')); return; }
      var parts = (input.value || '').split('-');
      if (parts.length === 3) {
        viewYear = parseInt(parts[0]);
        viewMonth = parseInt(parts[1]) - 1;
      } else {
        var now = new Date();
        viewYear = now.getFullYear();
        viewMonth = now.getMonth();
      }
      build();
      openDropdown(trigger, dd);
      wrap.classList.add('open');
      wrap.classList.add('fg-open');
      input.closest('.fg')?.classList.add('fg-open');
    });

    document.addEventListener('click', function() { closeDropdown(dd, wrap, input.closest('.fg')); });

    function syncDate() {
      trigger.querySelector('.cd-val').textContent = input.value ? formatDateLabel(input.value) : 'Выберите дату';
    }

    wrap.appendChild(trigger);
    wrap.appendChild(dd);
    input.style.position = 'absolute'; input.style.opacity = '0';
    input.style.width = '0'; input.style.height = '0'; input.style.pointerEvents = 'none';
    input._cdSync = syncDate;
    syncDate();
  }

  function syncCustomDate(id) {
    var s = document.getElementById(id);
    if (s && s._cdSync) s._cdSync();
  }

  // ==== Smooth Wheel Scroll ====
  function smoothWheelScroll(container, whenActive) {
    let target = container.scrollTop;
    let rafId = null;

    function tick() {
      const cur = container.scrollTop;
      const diff = target - cur;
      if (Math.abs(diff) < 1) { rafId = null; return; }
      container.scrollTop = cur + diff * 0.25;
      rafId = requestAnimationFrame(tick);
    }

    container.addEventListener('wheel', (e) => {
      if (typeof whenActive === 'function' && !whenActive()) return;
      if (e.target.closest('.ct-list, .cd-grid, .custom-date-dropdown, .custom-time-dropdown')) return;
      target = container.scrollTop + e.deltaY;
      target = Math.max(0, Math.min(target, container.scrollHeight - container.clientHeight));
      if (!rafId) rafId = requestAnimationFrame(tick);
      e.preventDefault();
    }, { passive: false });
  }

  smoothWheelScroll(document.documentElement, () => !modalOverlay.classList.contains('show'));

  // ==== Notifications ====
  const _notified = new Set();
  var _notifyPermRequested = false;

  function getTaskReminderTime(task) {
    if (!task.reminder || task.reminder === 'none') return null;
    const [y, m, d] = task.date.split('-').map(Number);
    const [h, min] = task.time.split(':').map(Number);
    const taskDate = new Date(y, m - 1, d, h, min, 0, 0);
    const offsets = { 'onTime': 0, '15min': 15 * 60 * 1000, '8h': 8 * 60 * 60 * 1000, '1d': 24 * 60 * 60 * 1000 };
    return new Date(taskDate.getTime() - (offsets[task.reminder] || 0));
  }

  let _lastCheck = Date.now();

  function notifyUser(title, body) {
    showToast(body);
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      var n = new Notification(title, { body: body, tag: 'plandaily', requireInteraction: true });
      (function(notif) {
        notif.onclick = function() { window.focus(); notif.close(); };
      })(n);
    } catch(e) {}
  }

  function checkReminders() {
    try {
      const now = Date.now();
      tasks.forEach(task => {
        if (task.done || _notified.has(task.id)) return;
        const remTime = getTaskReminderTime(task);
        if (!remTime) return;
        const rt = remTime.getTime();
        if (rt >= _lastCheck && rt <= now) {
          _notified.add(task.id);
          const when = formatDateLabel(task.date);
          notifyUser('PlanDaily', `⏰ «${task.title}» — ${when} в ${task.time}`);
        }
      });
      _lastCheck = now;
    } catch(e) {}
  }

  function requestNotifyPermission() {
    if (_notifyPermRequested) return;
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') return;
    if (Notification.permission === 'denied') {
      showToast('🔔 Уведомления отключены в настройках браузера');
      return;
    }
    _notifyPermRequested = true;
    try {
      var p = Notification.requestPermission();
      if (p && typeof p.then === 'function') {
        p.then(function(granted) {
          if (granted === 'granted') showToast('🔔 Уведомления включены — напоминания будут приходить в Windows');
        });
      }
    } catch(e) {}
  }

  // ==== Init ====
  createCustomSelect('dateSelect');
  createCustomSelect('prioritySelect');
  createCustomSelect('reminderSelect');
  createCustomTime('timeInput');
  createCustomDate('customDate');
  createCustomDate('filterDatePicker');
  loadTasks();
  render();

  setInterval(checkReminders, 30000);
  checkReminders();

  smoothWheelScroll(modalContent, () => modalOverlay.classList.contains('show'));

  setInterval(function() { if (!window._isEditing) render(); }, 60000);

  document.addEventListener('click', requestNotifyPermission, { once: true });

  initTouchDrag($('taskList'));

  // ==== Notifications ====
  const NOTIF_KEY = 'plandaily_notifications';

  function getNotifs() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY)) || []; } catch(e) { return []; } }
  function saveNotifs(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }

  function addNotif(type, ref, icon, title, text) {
    var notifs = getNotifs();
    if (notifs.some(function(x) { return x.type === type && x.ref === ref; })) return;
    notifs.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), type: type, ref: ref, icon: icon, title: title, text: text, read: false, time: Date.now() });
    saveNotifs(notifs);
    updateNotifBadge();
  }

  function markNotifRead(id) {
    var notifs = getNotifs();
    notifs.forEach(function(n) { if (n.id === id) n.read = true; });
    saveNotifs(notifs);
    updateNotifBadge();
  }

  function markAllNotifsRead() {
    var notifs = getNotifs();
    notifs.forEach(function(n) { n.read = true; });
    saveNotifs(notifs);
    updateNotifBadge();
  }

  function getUnreadNotifCount() { return getNotifs().filter(function(n) { return !n.read; }).length; }

  function updateNotifBadge() {
    var badge = document.getElementById('notifBadge');
    var c = getUnreadNotifCount();
    badge.textContent = c > 0 ? (c > 99 ? '99+' : c) : '';
    badge.classList.toggle('show', c > 0);
    document.title = c > 0 ? '(' + (c > 99 ? '99+' : c) + ') PlanDaily' : 'PlanDaily';
  }

  function closeNotifDropdown() { document.getElementById('notifDropdown').classList.remove('open'); }

  function showNotifications(e) {
    if (e) { e.stopPropagation(); }
    var dd = document.getElementById('notifDropdown');
    if (dd.classList.contains('open')) { dd.classList.remove('open'); return; }
    var btn = document.getElementById('notifBtn');
    var rect = btn.getBoundingClientRect();
    var notifs = getNotifs();
    var html = '<div class="notif-header"><span>🔔 Уведомления</span>';
    if (notifs.some(function(n) { return !n.read; })) html += '<button onclick="markAllNotifsRead();showNotifications(event)">📖 Всё прочитано</button>';
    html += '</div>';
    if (notifs.length === 0) {
      html += '<div class="notif-empty">Нет уведомлений</div>';
    } else {
      notifs.forEach(function(n) {
        html += '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="handleNotifClick(\'' + n.id + '\',\'' + n.type + '\',\'' + (n.ref || '') + '\')">' +
          '<div class="notif-icon">' + n.icon + '</div>' +
          '<div class="notif-body">' +
          '<div class="notif-title">' + n.title + '</div>' +
          (n.text ? '<div class="notif-text">' + n.text + '</div>' : '') +
          '<div class="notif-time">' + (function(d){ var m=Math.floor((Date.now()-d)/60000); if(m<1)return'только что'; if(m<60)return m+' мин. назад'; var h=Math.floor(m/60); if(h<24)return h+' ч. назад'; return Math.floor(h/24)+' дн. назад'; })(n.time) + '</div>' +
          '</div></div>';
      });
    }
    dd.innerHTML = html;
    dd.style.left = Math.min(Math.max(rect.left, 6), window.innerWidth - 330) + 'px';
    dd.style.top = (rect.bottom + 6) + 'px';
    dd.style.maxHeight = Math.min(400, window.innerHeight - rect.bottom - 30) + 'px';
    dd.classList.add('open');
  }

  function handleNotifClick(id, type, ref) {
    markNotifRead(id);
    closeNotifDropdown();
    if (type === 'changelog') {
      showChangelog();
    } else if (type === 'overdue' && ref) {
      var task = tasks.find(function(t) { return t.id === ref; });
      if (task) {
        if (task.date !== getFilterDate()) {
          customFilterDate = task.date;
          customDateInput.value = task.date;
          syncCustomDate('customDate');
          setDateFilter('custom');
        } else {
          render();
        }
        setTimeout(function() {
          var el = document.querySelector('.task-item[data-id="' + ref + '"]');
          if (el) {
            document.querySelector('.task-item.highlight')?.classList.remove('highlight');
            el.classList.add('highlight');
            var top = el.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop);
            document.documentElement.scrollTop = Math.max(0, top - 80);
            document.body.scrollTop = Math.max(0, top - 80);
          }
        }, 150);
      }
    }
    updateNotifBadge();
  }

  function checkOverdueNotifs() {
    tasks.forEach(function(t) {
      if (t.done) return;
      if (isOverdue(t.date, t.time)) addNotif('overdue', t.id, '⏰', 'Просроченная задача', t.title.length > 50 ? t.title.slice(0,50) + '…' : t.title);
    });
  }

  function checkChangelogNotif() {
    var last = localStorage.getItem('plandaily_last_version');
    var cur = CHANGELOG[0].version;
    if (last !== cur) {
      addNotif('changelog', cur, '📋', 'Обновление PlanDaily ' + cur, 'Вышла новая версия — нажмите, чтобы посмотреть изменения');
      localStorage.setItem('plandaily_last_version', cur);
    }
  }

  // ==== Performance Detection ====
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
      navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4 ||
      /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
    document.body.classList.add('perf-low');
  }

  checkChangelogNotif();
  checkOverdueNotifs();
  updateNotifBadge();

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.notif-dropdown') && !e.target.closest('#notifBtn')) closeNotifDropdown();
  });
</script>

</body>
