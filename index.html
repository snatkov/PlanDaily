  // ==== Custom Time Picker ====
  function createCustomTime(id) {
    var input = document.getElementById(id);
    if (!input) return;
    var wrap = document.createElement('div');
    wrap.className = 'custom-time';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    var trigger = document.createElement('div');
    trigger.className = 'custom-time-trigger';
    trigger.innerHTML = '<span class="ct-val"></span><span class="ct-icon">🕐</span>';

    var dd = document.createElement('div');
    dd.className = 'custom-time-dropdown';
    dd._origParent = wrap;
    dd.innerHTML = '<div class="ct-cols"><div class="ct-col"><div class="ct-col-label">Час</div><div class="ct-list" id="ct-hours"></div></div><div class="ct-col"><div class="ct-col-label">Мин</div><div class="ct-list" id="ct-mins"></div></div></div>';

    var hoursList = dd.querySelector('#ct-hours');
    var minsList = dd.querySelector('#ct-mins');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function build() {
      hoursList.innerHTML = '';
      minsList.innerHTML = '';
      for (var h = 0; h < 24; h++) {
        var el = document.createElement('div');
        el.className = 'ct-item' + (h === curH ? ' selected' : '');
        el.textContent = pad(h);
        el.dataset.h = h;
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          curH = parseInt(this.dataset.h);
          sync();
        });
        hoursList.appendChild(el);
      }
      for (var m = 0; m < 60; m++) {
        var el = document.createElement('div');
        el.className = 'ct-item' + (m === curM ? ' selected' : '');
        el.textContent = pad(m);
        el.dataset.m = m;
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          curM = parseInt(this.dataset.m);
          sync();
          closeDropdown(dd, wrap, input.closest('.fg'));
        });
        minsList.appendChild(el);
      }
      var selH = hoursList.querySelector('.selected');
      if (selH) selH.scrollIntoView({ block: 'center' });
      var selM = minsList.querySelector('.selected');
      if (selM) selM.scrollIntoView({ block: 'center' });
    }

    var curH = 9, curM = 0;

    function sync() {
      if (curH > 23) curH = 0;
      if (curH < 0) curH = 23;
      if (curM > 59) curM = 0;
      if (curM < 0) curM = 59;
      var val = pad(curH) + ':' + pad(curM);
      input.value = val;
      trigger.querySelector('.ct-val').textContent = val;
      Array.from(hoursList.children).forEach(function(el) { el.classList.toggle('selected', parseInt(el.dataset.h) === curH); });
      Array.from(minsList.children).forEach(function(el) { el.classList.toggle('selected', parseInt(el.dataset.m) === curM); });
    }

    var _scrub = null;
    var _scrubMoved = false;

    trigger.addEventListener('click', function(e) {
      if (_scrubMoved) { _scrubMoved = false; return; }
      e.stopPropagation();
      if (dd.classList.contains('open')) { closeDropdown(dd, wrap, input.closest('.fg')); return; }
      var parts = (input.value || '09:00').split(':');
      curH = parseInt(parts[0]) || 0;
      curM = parseInt(parts[1]) || 0;
      build();
      openDropdown(trigger, dd);
      wrap.classList.add('open');
      input.closest('.fg')?.classList.add('fg-open');
    });

    trigger.addEventListener('mousedown', function(e) {
      _scrub = { startY: e.clientY, h: curH, m: curM };
      _scrubMoved = false;
    });

    document.addEventListener('mousemove', function(e) {
      if (!_scrub) return;
      var dy = e.clientY - _scrub.startY;
      if (!_scrubMoved && Math.abs(dy) > 3) {
        _scrubMoved = true;
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
      }
      if (!_scrubMoved) return;
      e.preventDefault();
      var delta = Math.round((_scrub.startY - e.clientY) / 5);
      var total = (_scrub.h * 60 + _scrub.m) + delta;
      total = Math.max(0, Math.min(1439, total));
      curH = Math.floor(total / 60);
      curM = total % 60;
      sync();
    });

    document.addEventListener('mouseup', function() {
      if (!_scrub) return;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      if (_scrubMoved) {
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
      _scrub = null;
    });

    trigger.addEventListener('touchstart', function(e) {
      _scrub = { startY: e.touches[0].clientY, h: curH, m: curM };
      _scrubMoved = false;
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!_scrub) return;
      var ty = e.touches[0].clientY;
      var dy = ty - _scrub.startY;
      if (!_scrubMoved && Math.abs(dy) > 5) {
        _scrubMoved = true;
      }
      if (!_scrubMoved) return;
      e.preventDefault();
      var delta = Math.round((_scrub.startY - ty) / (window.innerWidth < 768 ? 3 : 5));
      var total = (_scrub.h * 60 + _scrub.m) + delta;
      total = Math.max(0, Math.min(1439, total));
      curH = Math.floor(total / 60);
      curM = total % 60;
      sync();
    }, { passive: false });

    document.addEventListener('touchend', function() {
      if (!_scrub) return;
      if (_scrubMoved) {
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
      _scrub = null;
    });

    wrap.addEventListener('wheel', function(e) {
      if (!e.target.closest('.custom-time-trigger')) return;
      e.preventDefault();
      e.stopPropagation();
      var step = e.shiftKey ? 15 : 1;
      var total = curH * 60 + curM + (e.deltaY > 0 ? -step : step);
      total = Math.max(0, Math.min(1439, total));
      curH = Math.floor(total / 60);
      curM = total % 60;
      sync();
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }, { passive: false, capture: true });

    document.addEventListener('click', function() { closeDropdown(dd, wrap, input.closest('.fg')); });

    wrap.appendChild(trigger);
    wrap.appendChild(dd);
    input.style.position = 'absolute'; input.style.opacity = '0';
    input.style.width = '0'; input.style.height = '0'; input.style.pointerEvents = 'none';
    sync();
  }

  // ==== Custom Date Picker ====
  function createCustomDate(id) {
    var input = document.getElementById(id);
    if (!input) return;
    var wrap = document.createElement('div');
    wrap.className = 'custom-date';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    var trigger = document.createElement('div');
    trigger.className = 'custom-date-trigger';
    trigger.innerHTML = '<span class="cd-val"></span><span class="ct-icon">📅</span>';

    var dd = document.createElement('div');
    dd.className = 'custom-date-dropdown';
    dd._origParent = wrap;

    var viewYear, viewMonth;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function getTaskDates() {
      var dates = {};
      tasks.forEach(function(t) { dates[t.date] = true; });
      return dates;
    }

    function build() {
      var taskDates = getTaskDates();
      var now = new Date();
      var todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
      var selectedDate = input.value || todayStr;

      var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      var dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

      var first = new Date(viewYear, viewMonth, 1);
      var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      var startDow = first.getDay() || 7; // Mon=1 ... Sun=7

      var html = '';
      html += '<div class="cd-header">' +
        '<button class="cd-nav" data-dir="-1">◀</button>' +
        '<span class="cd-month">' + months[viewMonth] + ' ' + viewYear + '</span>' +
        '<button class="cd-nav" data-dir="1">▶</button>' +
        '</div>';

      html += '<div class="cd-days">';
      dows.forEach(function(d) { html += '<div class="cd-dow">' + d + '</div>'; });

      for (var i = 1; i < startDow; i++) {
        html += '<div class="cd-day other"></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(d);
        var cls = 'cd-day';
        if (dateStr === todayStr) cls += ' today';
        if (dateStr === selectedDate) cls += ' selected';
        if (taskDates[dateStr]) cls += ' has-tasks';
        html += '<div class="' + cls + '" data-date="' + dateStr + '">' + d + '</div>';
      }
      var totalCells = startDow - 1 + daysInMonth;
      var trailing = 7 - (totalCells % 7);
      if (trailing > 0 && trailing < 7) {
        for (var i = 0; i < trailing; i++) { html += '<div class="cd-day other"></div>'; }
      }
      html += '</div>';

      dd.innerHTML = html;

      dd.querySelectorAll('.cd-nav').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          viewMonth += parseInt(this.dataset.dir);
          if (viewMonth > 11) { viewMonth = 0; viewYear++; }
          if (viewMonth < 0) { viewMonth = 11; viewYear--; }
          build();
        });
      });

      dd.querySelectorAll('.cd-day:not(.other)').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          input.value = this.dataset.date;
          trigger.querySelector('.cd-val').textContent = formatDateLabel(input.value);
          input.dispatchEvent(new Event('change', { bubbles: true }));
          closeDropdown(dd, wrap, input.closest('.fg'));
        });
        // Drag-and-drop to change date (v2.7)
        el.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        el.addEventListener('drop', function(e) {
          e.preventDefault();
          var id = e.dataTransfer.getData('text/plain');
          if (!id) return;
          var newDate = this.dataset.date;
          if (!newDate) return;
          var task = tasks.find(function(t) { return t.id === id; });
          if (task && task.date !== newDate) {
            task.date = newDate;
            saveTasks(); render();
            showToast('📅 Задача перенесена на ' + formatDateLabel(newDate));
          }
        });
      });
    }

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      if (dd.classList.contains('open')) { closeDropdown(dd, wrap, input.closest('.fg')); return; }
      var parts = (input.value || '').split('-');
      if (parts.length === 3) {
        viewYear = parseInt(parts[0]);
        viewMonth = parseInt(parts[1]) - 1;
      } else {
        var now = new Date();
        viewYear = now.getFullYear();
        viewMonth = now.getMonth();
      }
      build();
      openDropdown(trigger, dd);
      wrap.classList.add('open');
      wrap.classList.add('fg-open');
      input.closest('.fg')?.classList.add('fg-open');
    });

    document.addEventListener('click', function() { closeDropdown(dd, wrap, input.closest('.fg')); });

    function syncDate() {
      trigger.querySelector('.cd-val').textContent = input.value ? formatDateLabel(input.value) : 'Выберите дату';
    }

    wrap.appendChild(trigger);
    wrap.appendChild(dd);
    input.style.position = 'absolute'; input.style.opacity = '0';
    input.style.width = '0'; input.style.height = '0'; input.style.pointerEvents = 'none';
    input._cdSync = syncDate;
    syncDate();
  }

    var s = document.getElementById(id);
    if (s && s._cdSync) s._cdSync();
  }

  // ==== Smooth Wheel Scroll ====
  function smoothWheelScroll(container, whenActive) {
    let target = container.scrollTop;
    let rafId = null;

    function tick() {
      const cur = container.scrollTop;
      const diff = target - cur;
      if (Math.abs(diff) < 1) { rafId = null; return; }
      container.scrollTop = cur + diff * 0.25;
      rafId = requestAnimationFrame(tick);
    }

    container.addEventListener('wheel', (e) => {
      if (typeof whenActive === 'function' && !whenActive()) return;
      if (e.target.closest('.ct-list, .cd-days, .custom-date-dropdown, .custom-time-dropdown, .notif-dropdown, textarea')) return;
      target = container.scrollTop + e.deltaY;
      target = Math.max(0, Math.min(target, container.scrollHeight - container.clientHeight));
      if (!rafId) rafId = requestAnimationFrame(tick);
      e.preventDefault();
    }, { passive: false });

    container._smoothWheelStop = function() { target = container.scrollTop; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } };
  }

  smoothWheelScroll(document.documentElement, () => !modalOverlay.classList.contains('show'));

  // ==== Notifications ====
  const _notified = new Set();
  var _notifyPermRequested = false;

  function getTaskReminderTime(task) {
    if (!task.reminder || task.reminder === 'none') return null;
    const [y, m, d] = task.date.split('-').map(Number);
    const [h, min] = task.time.split(':').map(Number);
    const taskDate = new Date(y, m - 1, d, h, min, 0, 0);
    const offsets = { 'onTime': 0, '15min': 15 * 60 * 1000, '8h': 8 * 60 * 60 * 1000, '1d': 24 * 60 * 60 * 1000 };
    return new Date(taskDate.getTime() - (offsets[task.reminder] || 0));
  }

  let _lastCheck = Date.now();

  function notifyUser(title, body) {
    showToast(body);
    notifySW(title, body);
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      var n = new Notification(title, { body: body, tag: 'plandaily', requireInteraction: true });
      (function(notif) {
        notif.onclick = function() { window.focus(); notif.close(); };
      })(n);
    } catch(e) {}
  }

  function checkReminders() {
    try {
      const now = Date.now();
      tasks.forEach(task => {
        if (task.done || _notified.has(task.id)) return;
        const remTime = getTaskReminderTime(task);
        if (!remTime) return;
        const rt = remTime.getTime();
        if (rt >= _lastCheck && rt <= now) {
          _notified.add(task.id);
          const when = formatDateLabel(task.date);
          notifyUser('PlanDaily', `⏰ «${task.title}» — ${when} в ${task.time}`);
        }
      });
      _lastCheck = now;
    } catch(e) {}
  }

  function requestNotifyPermission() {
    if (_notifyPermRequested) return;
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') return;
    if (Notification.permission === 'denied') {
      showToast('🔔 Уведомления отключены в настройках браузера');
      return;
    }
    _notifyPermRequested = true;
    try {
      var p = Notification.requestPermission();
      if (p && typeof p.then === 'function') {
        p.then(function(granted) {
          if (granted === 'granted') showToast('🔔 Уведомления включены');
        });
      }
    } catch(e) {}
  }

  // ==== v2.7: Notes ====
  function noteToHtml(text) {
    if (!text) return '';
    if (/<[a-z][\s\S]*>/i.test(text)) return text;
    return text
      .replace(/\[ \]/g, '<span class="note-mark" contenteditable="false">\u25CB</span> ')
      .replace(/\[x\]/gi, '<span class="note-mark checked" contenteditable="false">\u25CF</span> ')
      .replace(/\n/g, '<br>');
  }

  function noteInsertCB() {
    var el = document.getElementById('noteEditor');
    if (!el) return;
    el.focus();
    document.execCommand('insertHTML', false, '<span class="note-mark" contenteditable="false">\u25CB</span> ');
  }

  function noteToggleMark(e) {
    var span = e.target.closest('.note-mark');
    if (!span) return;
    e.preventDefault();
    if (span.textContent === '\u25CB') { span.textContent = '\u25CF'; span.classList.add('checked'); }
    else { span.textContent = '\u25CB'; span.classList.remove('checked'); }
  }

  function noteFormatBold() {
    var el = document.getElementById('noteEditor');
    if (!el) return;
    el.focus();
    document.execCommand('bold');
    noteUpdateToolbar();
  }

  function noteFormatItalic() {
    var el = document.getElementById('noteEditor');
    if (!el) return;
    el.focus();
    document.execCommand('italic');
    noteUpdateToolbar();
  }

  function noteChangeFontSize(val) {
    var el = document.getElementById('noteEditor');
    if (!el) return;
    el.focus();
    if (window._noteRange) {
      try { window.getSelection().removeAllRanges(); window.getSelection().addRange(window._noteRange); } catch(e) {}
      delete window._noteRange;
    }
    if (val === 'normal') document.execCommand('fontSize', false, 3);
    else if (val === 'small') document.execCommand('fontSize', false, 1);
    else if (val === 'large') document.execCommand('fontSize', false, 5);
    else if (val === 'huge') document.execCommand('fontSize', false, 7);
    el.focus();
    var group = el.closest('.note-editor-wrap')?.querySelector('.nt-fs-group');
    if (group) {
      var btns = group.querySelectorAll('.nt-fs-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      var btn = group.querySelector('[data-fs="' + val + '"]');
      if (btn) btn.classList.add('active');
    }
  }

  function noteUpdateToolbar() {
    var boldBtn = document.querySelector('.nt-bold');
    var italicBtn = document.querySelector('.nt-italic');

    if (italicBtn) italicBtn.classList.toggle('note-active', document.queryCommandState('italic'));

  function editNote(id) {

      '<button class="nt-bold" onclick="noteFormatBold()" title="Жирный"><b>B</b></button>' +
      '<button class="nt-italic" onclick="noteFormatItalic()" title="Курсив"><i>I</i></button>' +
      '<span class="nt-sep"></span>' +

      '<button class="nt-fs-btn active" data-fs="normal" onclick="noteChangeFontSize(\'normal\')" title="Обычный">A</button>' +

  // ==== v2.7: Swipe gestures ====
  function initSwipeGestures(container) {
    if (!container || !('ontouchstart' in window)) return;

    container.addEventListener('touchstart', function(e) {
      var item = e.target.closest('.task-item');
      if (!item || e.target.closest('.btn-icon,.task-check,.task-drag-handle,.task-actions')) return;
      if (item.closest('.archived-item')) return;
      var t = e.touches[0];
      _swipeData = { item: item, id: item.dataset.id, startX: t.clientX, startY: t.clientY, dx: 0 };
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
      if (!_swipeData) return;
      var t = e.touches[0];
      var dx = t.clientX - _swipeData.startX;
      var dy = Math.abs(t.clientY - _swipeData.startY);
      if (dy > 30) { _swipeData = null; return; }
      if (Math.abs(dx) < 10) return;
      e.preventDefault();
      _swipeData.dx = dx;
      _swipeData.item.style.transition = 'none';
      _swipeData.item.style.transform = 'translateX(' + dx + 'px)';
      _swipeData.item.classList.toggle('swipe-delete', dx < -40);
      _swipeData.item.classList.toggle('swipe-done', dx > 40);
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
      if (!_swipeData) return;
      var dx = _swipeData.dx || 0;
      var id = _swipeData.id;
      var el = _swipeData.item;
      _swipeData = null;
      el.style.transition = 'transform 0.25s ease, background 0.25s ease';
      el.classList.remove('swipe-delete', 'swipe-done');
      if (dx < -80) {
        el.style.transform = 'translateX(-120%)';
        setTimeout(function() { deleteTask(id); el.style.transform = ''; }, 250);
      } else if (dx > 80) {
        el.style.transform = 'translateX(80px)';
        toggleTask(id);
        setTimeout(function() { el.style.transform = ''; }, 300);
      } else {
        el.style.transform = '';
        el.style.transition = '';
      }
    }, { passive: true });
  }

  // ==== v2.7: Drag date drop ====
  function initDateDrop() {
    document.addEventListener('dragstart', function(e) {
      var item = e.target.closest('.task-item');
      if (item) e.dataTransfer.setData('text/plain', item.dataset.id);
    });

  // ==== v2.7: Focus Mode (Pomodoro) ====
  function focusTimeInput(value, min, max, cls) {
    return '<input type="number" class="focus-time-unit ' + cls + '" value="' + value + '" min="' + min + '" max="' + max + '" step="1">';
  }

  function makeTimeRow(label, idPrefix, h, m, s) {
    return '<div class="focus-time-row">' +
      '<label>' + label +
      focusTimeInput(h, 0, 23, idPrefix + '-hh') + '<span class="focus-time-label">ч</span>' +
      '<span class="focus-time-colon">:</span>' +
      focusTimeInput(m, 0, 59, idPrefix + '-mm') + '<span class="focus-time-label">м</span>' +
      '<span class="focus-time-colon">:</span>' +
      focusTimeInput(s, 0, 59, idPrefix + '-ss') + '<span class="focus-time-label">с</span>' +
      '</label></div>';
  }

  function initFocusTimeInputs(container) {
    container.querySelectorAll('.focus-time-unit').forEach(function(inp) {
      inp.addEventListener('wheel', function(e) {
        e.preventDefault();
        var step = e.shiftKey ? 5 : 1;
        var dir = e.deltaY > 0 ? -1 : 1;
        var val = parseInt(this.value) || 0;
        val = Math.max(parseInt(this.min), Math.min(parseInt(this.max), val + dir * step));
        this.value = val;
      }, { passive: false });

      inp.addEventListener('input', function() {
        var val = parseInt(this.value);
        if (isNaN(val)) { this.value = this.min; return; }
        this.value = Math.max(parseInt(this.min), Math.min(parseInt(this.max), val));
      });

      var _scrub = null;
      inp.addEventListener('mousedown', function(e) {
        _scrub = { startY: e.clientY, val: parseInt(this.value) || 0, el: this };
      });
      document.addEventListener('mousemove', function(e) {
        if (!_scrub) return;
        var dy = _scrub.startY - e.clientY;
        if (Math.abs(dy) > 2) {
          document.body.style.cursor = 'ns-resize';
          document.body.style.userSelect = 'none';
        }
        var step = e.shiftKey ? 5 : 1;
        var val = _scrub.val + Math.round(dy / 8) * step;
        val = Math.max(parseInt(_scrub.el.min), Math.min(parseInt(_scrub.el.max), val));
        _scrub.el.value = val;
      });
      document.addEventListener('mouseup', function() {
        if (_scrub) { document.body.style.cursor = ''; document.body.style.userSelect = ''; _scrub = null; }
      });
    });
  }

  function getTimeFromInputs(prefix) {
    var hh = parseInt(document.querySelector('.' + prefix + '-hh')?.value) || 0;
    var mm = parseInt(document.querySelector('.' + prefix + '-mm')?.value) || 0;
    var ss = parseInt(document.querySelector('.' + prefix + '-ss')?.value) || 0;
    return hh * 3600 + mm * 60 + ss;
  }

  function openFocus(id) {
    var task = tasks.find(function(t) { return t.id === id; });
    if (!task) return;
    var overlay = getFocusOverlay();
    overlay.innerHTML =
      '<div class="focus-card" onclick="event.stopPropagation()">' +
      '<div class="focus-task-title">' + escapeHtml(task.title) + '</div>' +
      '<div class="focus-task-date">📅 ' + formatDateLabel(task.date) + '</div>' +
      '<div style="margin:16px 0 8px">' +
      makeTimeRow('🎯 Фокус', 'fw', 0, 25, 0) +
      makeTimeRow('☕ Перерыв', 'fb', 0, 5, 0) +
      '</div>' +
      '<div class="focus-actions">' +
      '<button class="btn btn-primary" onclick="startFocusWithTime(\'' + id + '\')">▶️ Начать</button>' +
      '<button class="btn" onclick="closeFocus()">✖️ Отмена</button>' +
      '</div></div>';
    overlay.classList.add('open');
    initFocusTimeInputs(overlay);
  }

  function getFocusOverlay() {
    var overlay = document.getElementById('focusOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'focusOverlay';
      overlay.className = 'focus-overlay';
      overlay.onclick = function(e) { if (e.target === overlay) closeFocus(); };
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function startFocusWithTime(id) {
    var workSecs = getTimeFromInputs('fw');
    var breakSecs = getTimeFromInputs('fb');
    if (workSecs < 10) workSecs = 10;
    if (breakSecs < 10) breakSecs = 10;
    _focusState = { taskId: id, phase: 'work', remaining: workSecs, workLen: workSecs, breakLen: breakSecs };
    renderFocusUI();
    startFocusTimer();
  }

  function renderFocusUI() {
    var overlay = getFocusOverlay();
    if (!_focusState) { overlay.classList.remove('open'); return; }
    var task = tasks.find(function(t) { return t.id === _focusState.taskId; });
    if (!task) { closeFocus(); return; }
    var total = _focusState.remaining;
    var hh = Math.floor(total / 3600);
    var mm = Math.floor((total % 3600) / 60);
    var ss = total % 60;
    var timeStr = (hh > 0 ? hh + ':' + String(mm).padStart(2, '0') : String(mm).padStart(2, '0')) + ':' + String(ss).padStart(2, '0');
    var phaseLabel = _focusState.phase === 'work' ? '🎯 Фокус' : '☕ Перерыв';
    var running = _focusInterval !== null;
    overlay.innerHTML =
      '<div class="focus-card" onclick="event.stopPropagation()">' +
      '<div class="focus-task-title">' + escapeHtml(task.title) + '</div>' +
      '<div class="focus-task-date">📅 ' + formatDateLabel(task.date) + '</div>' +
      '<div class="focus-phase ' + _focusState.phase + '">' + phaseLabel + '</div>' +
      '<div class="focus-timer' + (_focusState.remaining <= 0 ? ' stopped' : '') + (running ? '' : _focusState.remaining > 0 ? ' paused' : '') + '">' + timeStr + '</div>' +
      (_focusState.remaining > 0 && !running ? '<div style="font-size:13px;color:var(--orange);margin-bottom:8px">⏸️ На паузе</div>' : '') +
      '<div class="focus-actions">' +
      (running
        ? '<button class="btn" onclick="pauseFocus()">⏸️ Пауза</button>'
        : (_focusState.remaining > 0
            ? '<button class="btn btn-primary" onclick="resumeFocus()">▶️ Продолжить</button>'
            : '<button class="btn btn-primary" onclick="resumeFocus()">▶️ Старт</button>')) +
      '<button class="btn" onclick="skipFocusPhase()">⏭️ Пропустить</button>' +
      '<button class="btn" onclick="closeFocus()">✖️ Закрыть</button>' +
      '</div>' +
      '<div class="focus-sessions">🧘 Сегодня: ' + _focusSessions + ' сессий</div>' +
      '</div>';
    overlay.classList.add('open');
  }

  function startFocusTimer() {
    if (_focusInterval) clearInterval(_focusInterval);
    _focusInterval = setInterval(function() {
      if (!_focusState) { closeFocus(); return; }
      if (_focusState.remaining > 0) {
        _focusState.remaining--;
        renderFocusUI();
      }
      if (_focusState.remaining <= 0) {
        clearInterval(_focusInterval);
        _focusInterval = null;
        if (_focusState.phase === 'work') {
          _focusSessions++;
          _focusState.phase = 'break';
          _focusState.remaining = _focusState.breakLen;
          showToast('☕ Время перерыва! ' + Math.round(_focusState.breakLen / 60) + ' минут');
          try { if ('Notification' in window && Notification.permission === 'granted') new Notification('PlanDaily', { body: '☕ Время перерыва!', tag: 'plandaily-focus' }); } catch(e) {}
          renderFocusUI();
          startFocusTimer();
        } else {
          showToast('🎯 Фокус-сессия завершена!');
          try { if ('Notification' in window && Notification.permission === 'granted') new Notification('PlanDaily', { body: '🎯 Фокус-сессия завершена!', tag: 'plandaily-focus' }); } catch(e) {}
          closeFocus();
        }
      }
    }, 1000);
  }

  function pauseFocus() {
    if (_focusInterval) { clearInterval(_focusInterval); _focusInterval = null; }
    renderFocusUI();
  }

  function resumeFocus() {
    if (_focusState && _focusState.remaining <= 0) {
      _focusState.remaining = _focusState.workLen;
      _focusState.phase = 'work';
    }
    startFocusTimer();
    renderFocusUI();
  }

  function skipFocusPhase() {
    if (_focusInterval) { clearInterval(_focusInterval); _focusInterval = null; }
    if (_focusState) _focusState.remaining = 0;
    renderFocusUI();
  }

  function closeFocus() {
    if (_focusInterval) { clearInterval(_focusInterval); _focusInterval = null; }
    _focusState = null;
    var overlay = document.getElementById('focusOverlay');
    if (overlay) overlay.classList.remove('open');
  }

  // ==== Sync ====
  var _syncState = { code: null, client: null, topic: null, pTopic: null, connected: false, paused: false, lastTs: 0, isMaster: false, deviceId: '' };
  var _syncDevices = {};
  var _syncForceTimer = null;

  function _saveDevices() {
    settings.syncDevices = _syncDevices; saveSettings();
    updateSyncBtn();
  }
  
  function updateSyncBtn() {
    var btn = document.getElementById('syncBtn');
    if (!btn) return;
    if (!_syncState.connected) { btn.textContent = '🌐 Синхронизация'; return; }
    var c = 0;
    if (settings.syncCode) { for (var id in _syncDevices) { if (_syncDevices[id].connected) c++; } }
    btn.textContent = c ? '🌐 Синхронизация (' + c + ')' : '🌐 Синхронизация';
  }

  function generateSyncCode() {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var result = '';
    var array = new Uint8Array(21);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) { crypto.getRandomValues(array); }
    else { for (var i = 0; i < 21; i++) array[i] = Math.floor(Math.random() * 256); }
    for (var i = 0; i < 21; i++) result += chars[array[i] % 62];
    return result;
  }

  function startSync(code, isMaster) {
    if (_syncState.client) stopSync();
    if (typeof mqtt === 'undefined') { console.warn('MQTT not loaded'); showToast('❌ Библиотека MQTT не загрузилась'); return; }
    _syncDevices = settings.syncDevices || {};
    _syncState.code = code;
    _syncState.isMaster = isMaster;
    _syncState.topic = 'pd/' + code + '/t';
    _syncState.pTopic = 'pd/' + code + '/p';
    _syncState.deviceId = settings.deviceId || '';
    if (!_syncState.deviceId) {
      _syncState.deviceId = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      settings.deviceId = _syncState.deviceId; saveSettings();
    }
    settings.syncCode = code; settings.syncIsMaster = isMaster; saveSettings();
    _syncState.client = mqtt.connect('wss://test.mosquitto.org:8081', {
      clientId: 'pd_' + _syncState.deviceId,
      reconnectPeriod: 3000, clean: true, protocolVersion: 4, path: '/',
      will: { topic: _syncState.pTopic + '/' + _syncState.deviceId, payload: JSON.stringify({ connected: false }), qos: 1, retain: true }
    });
    _syncState.client.on('connect', function() {
      console.log('MQTT connected');
      _syncState.connected = true; updateSyncBtn();
      showToast('🌐 Синхронизация подключена');
      _syncState.client.subscribe(_syncState.topic, { qos: 1 });
      _syncState.client.subscribe(_syncState.pTopic + '/+');
      _syncState.client.publish(_syncState.pTopic + '/' + _syncState.deviceId, JSON.stringify({
        role: isMaster ? 'master' : 'slave',
        type: navigator.maxTouchPoints > 0 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
        connected: true
      }), { retain: true, qos: 1 });
      flushSyncQueue();
      if (isMaster && (tasks.length > 0 || _deletedIds.length > 0)) {
        var connectPayload = { tasks: tasks, deleted: _deletedIds, ts: Date.now(), rev: Date.now(), full: true };
        _syncState.client.publish(_syncState.topic, JSON.stringify(connectPayload), { retain: true, qos: 1 });
      }
      _syncRevision = Date.now();
      saveSyncRev();
      if (!_syncState.isMaster) {
        setTimeout(function() {
          if (_syncState.connected) {
            _syncState.client.publish(_syncState.topic, JSON.stringify({ full: true }), { qos: 1 });
          }
        }, 1500);
      }
    });
    _syncState.client.on('message', function(topic, message) {
      if (topic.startsWith(_syncState.pTopic + '/')) {
        var devId = topic.slice(_syncState.pTopic.length + 1);
        if (devId === _syncState.deviceId) return;
        try {
          var d = JSON.parse(message.toString());
          if (d.kick) {
            showToast('👋 Отключены ведущим устройством');
            settings.syncCode = ''; saveSettings();
            stopSync(); return;
          }
          if (d.connected === false) { delete _syncDevices[devId]; _saveDevices(); updateSyncBtn(); }
          else {
            var isNew = !_syncDevices[devId];
            _syncDevices[devId] = { role: d.role || 'slave', type: d.type || 'desktop', connected: true };
            _saveDevices(); updateSyncBtn();
            if (isNew && _syncState.connected && _syncState.isMaster) {
              var newDevPayload = { tasks: tasks, deleted: _deletedIds, ts: Date.now(), rev: Date.now(), full: true };
              _syncState.client.publish(_syncState.topic, JSON.stringify(newDevPayload), { retain: true, qos: 1 });
              _syncRevision = Date.now();
              saveSyncRev();
            }
          }
        } catch(e) {}
        return;
      }
      if (topic !== _syncState.topic) return;
      try {
        var data = JSON.parse(message.toString());
        if (data.clear) {
          _syncState.paused = true; tasks = []; saveTasks(); render(); _syncState.paused = false;
          showToast('🔄 Код синхронизации пересоздан. Задачи очищены.');
          settings.syncCode = ''; saveSettings(); stopSync(); return;
        }
        if (data.full && _syncState.isMaster) {
          var fullPayload = { tasks: tasks, deleted: _deletedIds, ts: Date.now(), rev: Date.now(), full: true };
          _syncState.client.publish(_syncState.topic, JSON.stringify(fullPayload), { retain: true, qos: 1 });
          _syncRevision = Date.now();
          saveSyncRev();
          return;
        }
        if (data.tasks && Array.isArray(data.tasks)) {
          _syncState.paused = true;
          tasks = mergeTasks(data.tasks, data.deleted);
          if (data.rev && data.rev > _syncRevision) _syncRevision = data.rev;
          saveSyncRev(); saveTasks(); render(); _syncState.paused = false;
        } else if (data.deleted && Array.isArray(data.deleted)) {
          _syncState.paused = true;
          var localMap = {};
          tasks.forEach(function(t) { localMap[t.id] = t; });
          data.deleted.forEach(function(did) { delete localMap[did]; });
          tasks = [];
          for (var id in localMap) { tasks.push(localMap[id]); }
          saveTasks(); render(); _syncState.paused = false;
        }
      } catch(e) {}
    });
    _syncState.client.on('close', function() { _syncState.connected = false; updateSyncBtn(); });
    _syncState.client.on('offline', function() { _syncState.connected = false; });
    _syncState.client.on('reconnect', function() { _syncState.connected = false; updateSyncBtn(); });
    _syncState.client.on('error', function(err) { console.warn('MQTT error:', err.message || err); showToast('⚠️ MQTT: ' + (err.message || 'ошибка'), 3000); });
    _syncForceTimer = setInterval(function() {
      if (_syncState.connected) {
        _syncState.client.publish(_syncState.pTopic + '/' + _syncState.deviceId, JSON.stringify({
          role: _syncState.isMaster ? 'master' : 'slave',
          type: navigator.maxTouchPoints > 0 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
          connected: true
        }), { retain: true, qos: 1 });
        var changed = getChangedTasks();
        var hasChanges = changed.length > 0 || _deletedIds.length > 0;
        if (hasChanges) {
          var payload = { ts: Date.now(), rev: Date.now(), full: false };
          if (changed.length > 0) payload.tasks = changed;
          if (_deletedIds.length > 0) {
            payload.deleted = _deletedIds.slice();
            _deletedIds = [];
            saveDeletedIds();
          }
          _syncState.client.publish(_syncState.topic, JSON.stringify(payload), { retain: false, qos: 1 });
          _syncRevision = Date.now();
          saveSyncRev();
        }
        if (_syncState.isMaster) {
          var fullPayload = { tasks: tasks, deleted: _deletedIds, ts: Date.now(), rev: Date.now(), full: true };
          _syncState.client.publish(_syncState.topic, JSON.stringify(fullPayload), { retain: true, qos: 1 });
          _syncRevision = Date.now();
          saveSyncRev();
        }
        flushSyncQueue();
      }
    }, 180000);
  }

  function stopSync() {
    if (_syncForceTimer) { clearInterval(_syncForceTimer); _syncForceTimer = null; }
    if (_syncState.connected && _syncState.client && _syncState.pTopic && _syncState.deviceId) {
      _syncState.client.publish(_syncState.pTopic + '/' + _syncState.deviceId, JSON.stringify({ connected: false }), { retain: true, qos: 1 });
      _syncState.client.end(true);
    }
    _syncState = { code: null, client: null, topic: null, pTopic: null, connected: false, paused: false, lastTs: 0, isMaster: false, deviceId: '' };
    _syncDevices = {}; _saveDevices();
  }

  function pushSync() {
    if (!tasks || !Array.isArray(tasks)) return;
    var payload = { ts: Date.now(), rev: Date.now(), full: false };
    var changed = getChangedTasks();
    if (changed.length > 0) payload.tasks = changed;
    if (_deletedIds.length > 0) {
      payload.deleted = _deletedIds.slice();
      _deletedIds = [];
      saveDeletedIds();
    }
    if (!payload.tasks && !payload.deleted) return;
    if (!_syncState.connected || !_syncState.client || _syncState.paused) {
      enqueueSync(payload);
      return;
    }
    _syncState.client.publish(_syncState.topic, JSON.stringify(payload), { retain: false, qos: 1 });
    _syncRevision = Date.now();
    saveSyncRev();
  }

  function kickDevice(devId) {
    if (!_syncState.isMaster || !_syncState.connected) return;
    _syncState.client.publish(_syncState.pTopic + '/' + devId, JSON.stringify({ kick: true }), { qos: 1 });
    delete _syncDevices[devId]; _saveDevices();
    showToast('👋 Устройство отключено');
  }

  function regenerateSync() {
    if (!_syncState.code) return;
    if (!confirm('При пересоздании кода все подключённые устройства очистят задачи. Продолжить?')) return;
    if (_syncState.connected && _syncState.client) {
      _syncState.client.publish(_syncState.topic, JSON.stringify({ clear: true, ts: Date.now() }), { retain: true, qos: 1 });
      _syncState.client.end(true);
    }
    _syncState.client = null; _syncState.connected = false;
    tasks = []; _deletedIds = []; saveDeletedIds(); saveTasks(); render(); closeModal();
    var newCode = generateSyncCode();
    startSync(newCode, true);
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(newCode).catch(function(){}); }
    else { try { var ta = document.createElement('textarea'); ta.value = newCode; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); } catch(e){} }
    setTimeout(function() { showToast('🆕 Код скопирован: ' + newCode); }, 300);
  }

  function importSyncCode() {
    var input = document.getElementById('syncCodeInput');
    if (!input) return;
    var code = input.value.trim();
    if (code.length !== 21 || !/^[A-Za-z0-9]+$/.test(code)) { showToast('❌ Код: 21 символ (A-Z, a-z, 0-9)'); return; }
    closeModal(); startSync(code, false);
    setTimeout(function() { showToast('✅ Подключено к коду синхронизации'); }, 500);
  }

  function generateAndStartSync() {
    closeModal(); var code = generateSyncCode(); startSync(code, true);
    setTimeout(function() { showToast('🆕 Код: ' + code + '. Скопируйте его на другие устройства.'); }, 500);
  }

  function copySyncCode() {
    if (!_syncState.code) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(_syncState.code).then(function() { showToast('📋 Код скопирован'); }).catch(function() { fallbackCopy(_syncState.code); });
    } else { fallbackCopy(_syncState.code); }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('📋 Код скопирован'); } catch(e) { showToast('❌ Не удалось скопировать'); }
    document.body.removeChild(ta);
  }

  // ==== QR Scanner ====
  let _qrScanner = null;

  function showQRScanner() {
    if (_qrScanner) stopQRScanner();
    _qrScanner = { stream: null, video: null, timer: null };
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } })
      .then(function(stream) {
        _qrScanner.stream = stream;
        openModal(
          '<button class="close-modal" onclick="stopQRScanner();closeModal()">&times;</button>' +
          '<h2>📷 Наведите на QR-код</h2>' +
          '<div style="text-align:center">' +
          '<div style="position:relative;display:inline-block;width:100%;max-width:400px">' +
          '<video id="qrVideo" style="width:100%;border-radius:12px;background:#000;display:block" playsinline muted></video>' +
          '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;aspect-ratio:1;pointer-events:none;z-index:2">' +
          '<div style="position:absolute;top:0;left:0;width:20px;height:20px;border-top:3px solid rgba(255,255,255,0.9);border-left:3px solid rgba(255,255,255,0.9);border-radius:4px"></div>' +
          '<div style="position:absolute;top:0;right:0;width:20px;height:20px;border-top:3px solid rgba(255,255,255,0.9);border-right:3px solid rgba(255,255,255,0.9);border-radius:4px"></div>' +
          '<div style="position:absolute;bottom:0;left:0;width:20px;height:20px;border-bottom:3px solid rgba(255,255,255,0.9);border-left:3px solid rgba(255,255,255,0.9);border-radius:4px"></div>' +
          '<div style="position:absolute;bottom:0;right:0;width:20px;height:20px;border-bottom:3px solid rgba(255,255,255,0.9);border-right:3px solid rgba(255,255,255,0.9);border-radius:4px"></div>' +
          '<div style="position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.8);white-space:nowrap">Поместите QR-код в рамку</div>' +
          '</div>' +
          '</div>' +
          '<div id="qrStatus" style="margin-top:10px;font-size:14px;color:var(--text2)">⏳ Запуск камеры…</div>' +
          '</div>'
        );
        var video = document.getElementById('qrVideo');
        if (!video) { stopQRScanner(); return; }
        _qrScanner.video = video;
        video.srcObject = stream;
        video.play();
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        function tryScan() {
          if (!_qrScanner) return;
          if (video.readyState < 2 || video.videoWidth === 0) { _qrScanner.timer = setTimeout(tryScan, 150); return; }
          var status = document.getElementById('qrStatus');
          if (status && status.textContent.indexOf('⏳') !== -1) status.textContent = '📷 Наведите камеру на QR-код';
          try {
            var crop = 0.55;
            var cw = video.videoWidth, ch = video.videoHeight;
            var size = Math.min(cw, ch) * crop;
            var sx = (cw - size) / 2, sy = (ch - size) / 2;
            canvas.width = 400;
            canvas.height = 400;
            ctx.drawImage(video, sx, sy, size, size, 0, 0, 400, 400);
            if (typeof jsQR !== 'undefined') {
              var result = jsQR(ctx.getImageData(0, 0, 400, 400).data, 400, 400);
              if (result && result.data && result.data.length === 21 && /^[A-Za-z0-9]+$/.test(result.data)) {
                stopQRScanner();
                closeModal();
                startSync(result.data, false);
                showToast('✅ QR-код распознан');
                return;
              }
            }
          } catch(e) {}
          _qrScanner.timer = setTimeout(tryScan, 200);
        }
        _qrScanner.timer = setTimeout(tryScan, 150);
      })
      .catch(function(err) {
        openModal(
          '<button class="close-modal" onclick="closeModal()">&times;</button>' +
          '<h2>📷 Сканировать QR-код</h2>' +
          '<div style="text-align:center;padding:10px">' +
          '<div style="font-size:13px;color:var(--text2);margin-bottom:16px">❌ Камера недоступна: ' + err.message + '</div>' +
          '<input type="file" accept="image/*" capture="environment" id="qrFallbackInput" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);box-sizing:border-box">' +
          '</div>'
        );
        document.getElementById('qrFallbackInput')?.addEventListener('change', function(e) {
          if (e.target.files && e.target.files[0]) decodeQRFromFile(e.target.files[0]);
        });
      });
  }

  function decodeQRFromFile(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement('canvas');
        var scale = Math.min(1, 640 / Math.max(img.width, img.height));
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        try {
          if (typeof jsQR !== 'undefined') {
            var result = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
            if (result && result.data && result.data.length === 21 && /^[A-Za-z0-9]+$/.test(result.data)) {
              closeModal();
              startSync(result.data, false);
              showToast('✅ QR-код распознан');
              return;
            }
          }
        } catch(e) {}
        showToast('❌ QR-код не найден');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function stopQRScanner() {
    if (_qrScanner) {
      if (_qrScanner.timer) { clearTimeout(_qrScanner.timer); _qrScanner.timer = null; }
      if (_qrScanner.stream) { _qrScanner.stream.getTracks().forEach(function(t) { t.stop(); }); _qrScanner.stream = null; }
      _qrScanner = null;
    }
  }

  var _calDate = new Date();

  function renderCalendar() {
    var body = document.getElementById('calendarBody');
    if (!body) return;
    var year = _calDate.getFullYear();
    var month = _calDate.getMonth();
    var today = getDateStr(0);
    var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Окторябрь','Ноябрь','Декабрь'];
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var firstDow = new Date(year, month, 1).getDay();
    var dowLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<button class="btn" onclick="calNav(-1)" style="font-size:16px;padding:4px 10px">‹</button>' +
      '<span style="font-weight:600;font-size:16px">' + months[month] + ' ' + year + '</span>' +
      '<button class="btn" onclick="calNav(1)" style="font-size:16px;padding:4px 10px">›</button>' +
      '</div>';

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px;color:var(--text2);margin-bottom:4px">';
    dowLabels.forEach(function(l) { html += '<div style="padding:4px 0">' + l + '</div>'; });
    html += '</div>';

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center">';
    for (var i = 0; i < firstDow - 1; i++) { html += '<div></div>'; }
    var first = firstDow === 0 ? 6 : firstDow - 1;

    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var dayTasks = tasks.filter(function(t) { return t.date === dateStr && !t.archived && t.project === currentProject; });
      var isToday = dateStr === today;
      var isSelected = dateStr === customFilterDate && currentDateFilter === 'custom';
      var isWeekend = (new Date(year, month, d).getDay()) === 0 || (new Date(year, month, d).getDay()) === 6;
      var bg = isToday ? 'var(--primary)' : isSelected ? 'var(--accent)' : 'transparent';
      var txtColor = isToday ? '#fff' : isSelected ? '#fff' : isWeekend ? 'var(--red)' : 'var(--text)';
      var borderClr = isToday ? 'var(--primary)' : isSelected ? 'var(--accent)' : 'transparent';
      html += '<div onclick="closeModal();document.querySelector(\'[data-date=\\\'custom\\\']\')?.click();customDateInput.value=\'' + dateStr + '\';customFilterDate=\'' + dateStr + '\';setDateFilter(\'custom\')" ' +
        'ondragover="e.preventDefault()" ondrop="onCalendarDrop(event,\'' + dateStr + '\')" ' +
        'style="padding:4px 2px;border-radius:6px;cursor:pointer;font-size:12px;' +
        'background:' + bg + ';' +
        'color:' + txtColor + ';' +
        'min-height:36px;position:relative;border:1px solid ' + borderClr + '">' +
        '<div style="font-weight:' + (isToday ? '700' : isSelected ? '700' : '400') + '">' + d + '</div>';
      if (dayTasks.length > 0) {
        html += '<div style="display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px">';
        var colors = ['var(--primary)','var(--green)','var(--orange)','var(--accent2)'];
        var maxDots = Math.min(dayTasks.length, 4);
        for (var di = 0; di < maxDots; di++) {
          html += '<span style="width:5px;height:5px;border-radius:50%;background:' + colors[di % colors.length] + '"></span>';
        }
        if (dayTasks.length > 4) html += '<span style="font-size:8px;color:var(--text2)">+' + (dayTasks.length - 4) + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';

    body.innerHTML = html;
  }

  function calNav(dir) {
    _calDate.setMonth(_calDate.getMonth() + dir);
    renderCalendar();
  }

  function onCalendarDrop(e, dateStr) {
    e.preventDefault();
    var id = e.dataTransfer.getData('text/plain');
    if (!id) return;
    var task = tasks.find(function(t) { return t.id === id; });
    if (!task) return;
    task.date = dateStr;
    task._rev = Date.now();
    saveTasks(); render(); renderCalendar();
    showToast('📅 Задача перенесена на ' + dateStr);
  }

  // ==== SW Notification support ====
  function notifySW(title, body) {
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'notify', title: title, body: body, tag: 'plandaily-reminder' });
      }
    } catch(e) {}
  }

  // ==== Offline sync queue ====
  function getSyncQueue() { try { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY)) || []; } catch(e) { return []; } }
  function saveSyncQueue(q) { try { localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); } catch(e) {} }

  function enqueueSync(data) {
    var q = getSyncQueue();
    q.push({ data: data, ts: Date.now() });
    if (q.length > 100) q.splice(0, q.length - 100);
    saveSyncQueue(q);
  }

  function flushSyncQueue() {
    var q = getSyncQueue();
    if (!_syncState.connected || q.length === 0) return;
    q.forEach(function(item) {
      if (_syncState.connected) {
        try {
          _syncState.client.publish(_syncState.topic, JSON.stringify(item.data), { retain: false, qos: 1 });
        } catch(e) {}
      }
    });
    if (_deletedIds.length > 0) {
      _syncState.client.publish(_syncState.topic, JSON.stringify({ deleted: _deletedIds, ts: Date.now(), rev: Date.now(), full: false }), { retain: true, qos: 1 });
      _deletedIds = [];
      saveDeletedIds();
    }
    saveSyncQueue([]);
    if (q.length > 0) showToast('🔄 Отправлено ' + q.length + ' отложенных изменений');
  }

  // ==== Revision tracking for diff sync ====
  function getChangedTasks() {
    return tasks.filter(function(t) { return t._rev && t._rev > _syncRevision; });
  }

  function mergeTasks(remoteTasks, deletedIds) {
    if (!remoteTasks || !Array.isArray(remoteTasks)) return tasks || [];
    var merged = [];
    var localMap = {};
    tasks.forEach(function(t) { localMap[t.id] = t; });
    if (deletedIds && Array.isArray(deletedIds)) {
      deletedIds.forEach(function(did) { delete localMap[did]; });
    }
    remoteTasks.forEach(function(rt) {
      if (deletedIds && Array.isArray(deletedIds) && deletedIds.indexOf(rt.id) !== -1) return;
      var local = localMap[rt.id];
      if (!local || (rt._rev || 0) > (local._rev || 0)) {
        localMap[rt.id] = rt;
      }
    });
    for (var id in localMap) { merged.push(localMap[id]); }
    return merged;
  }
  loadTasks();
  renderProjectSwitcher();
  renderTagFilterBar();
  createCustomSelect('projectSwitcher');
  createCustomSelect('dateSelect');
  createCustomSelect('prioritySelect');
  createCustomSelect('reminderSelect');
  createCustomSelect('repeatSelect');
  createCustomTime('timeInput');
  createCustomDate('customDate');
  createCustomDate('filterDatePicker');
  render();
  if (settings.syncCode) setTimeout(function() { startSync(settings.syncCode, settings.syncIsMaster !== false); }, 100);

  setInterval(function() { checkReminders(); checkOverdueNotifs(); }, 30000);
  checkReminders();

  smoothWheelScroll(modalContent, () => modalOverlay.classList.contains('show'));

  setInterval(function() { if (!window._isEditing) render(); }, 60000);

  document.addEventListener('click', requestNotifyPermission, { once: true });

  initTouchDrag($('taskList'));
  initSwipeGestures($('taskList'));
  initDateDrop();

  // ==== Notifications ====
  const NOTIF_KEY = 'plandaily_notifications';

  function getNotifs() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY)) || []; } catch(e) { return []; } }
  function saveNotifs(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }

  function addNotif(type, ref, icon, title, text) {
    var notifs = getNotifs();
    if (notifs.some(function(x) { return x.type === type && x.ref === ref; })) return;
    notifs.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), type: type, ref: ref, icon: icon, title: title, text: text, read: false, time: Date.now() });
    saveNotifs(notifs);
    updateNotifBadge();
  }

  function markNotifRead(id) {
    var notifs = getNotifs();
    notifs.forEach(function(n) { if (n.id === id) n.read = true; });
    saveNotifs(notifs);
    updateNotifBadge();
  }

  function markAllNotifsRead() {
    var notifs = getNotifs();
    notifs.forEach(function(n) { n.read = true; });
    saveNotifs(notifs);
    updateNotifBadge();
  }

  function getUnreadNotifCount() { return getNotifs().filter(function(n) { return !n.read; }).length; }

  function updateNotifBadge() {
    var badge = document.getElementById('notifBadge');
    var c = getUnreadNotifCount();
    badge.textContent = c > 0 ? (c > 99 ? '99+' : c) : '';
    badge.classList.toggle('show', c > 0);
    document.title = c > 0 ? '(' + (c > 99 ? '99+' : c) + ') PlanDaily' : 'PlanDaily';
  }

  function closeNotifDropdown() { document.getElementById('notifDropdown').classList.remove('open'); }

  function showNotifications(e) {
    if (e) { e.stopPropagation(); }
    var dd = document.getElementById('notifDropdown');
    if (dd.classList.contains('open')) { dd.classList.remove('open'); return; }
    var btn = document.getElementById('notifBtn');
    var rect = btn.getBoundingClientRect();
    var notifs = getNotifs();
    var html = '<div class="notif-header"><span>🔔 Уведомления</span>';
    if (notifs.some(function(n) { return !n.read; })) html += '<button onclick="markAllNotifsRead();showNotifications(event)">📖 Всё прочитано</button>';
    html += '</div>';
    if (notifs.length === 0) {
      html += '<div class="notif-empty">Нет уведомлений</div>';
    } else {
      notifs.forEach(function(n) {
        html += '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="handleNotifClick(\'' + (n.id || '').replace(/'/g, "\\'") + '\',\'' + (n.type || '').replace(/'/g, "\\'") + '\',\'' + (n.ref || '').replace(/'/g, "\\'") + '\')">' +
          '<div class="notif-icon">' + n.icon + '</div>' +
          '<div class="notif-body">' +
          '<div class="notif-title">' + escapeHtml(n.title) + '</div>' +
          (n.text ? '<div class="notif-text">' + escapeHtml(n.text) + '</div>' : '') +
          '<div class="notif-time">' + (function(d){ var m=Math.floor((Date.now()-d)/60000); if(m<1)return'только что'; if(m<60)return m+' мин. назад'; var h=Math.floor(m/60); if(h<24)return h+' ч. назад'; return Math.floor(h/24)+' дн. назад'; })(n.time) + '</div>' +
          '</div></div>';
      });
    }
    dd.innerHTML = html;
    dd.style.left = Math.min(Math.max(rect.left, 6), window.innerWidth - 330) + 'px';
    dd.style.top = (rect.bottom + 6) + 'px';
    dd.style.maxHeight = Math.min(400, window.innerHeight - rect.bottom - 30) + 'px';
    dd.classList.add('open');
  }

  function handleNotifClick(id, type, ref) {
    markNotifRead(id);
    closeNotifDropdown();
    if (type === 'changelog') {
      showChangelog();
    } else if (type === 'overdue' && ref) {
      var task = tasks.find(function(t) { return t.id === ref; });
      if (task) {
        if (task.project && task.project !== currentProject) {
          currentProject = task.project;
          renderProjectSwitcher();
        }
        if (task.date !== getFilterDate()) {
          customFilterDate = task.date;
          customDateInput.value = task.date;
          setDateFilter('custom');
        }
        var el = document.querySelector('.task-item[data-id="' + ref + '"]');
        if (el) {
          el.style.animation = '';
          document.querySelector('.highlight')?.classList.remove('highlight');
          el.classList.add('highlight');
          el.addEventListener('animationend', function handler(e) {
            if (e.animationName === 'notif-highlight') { el.classList.remove('highlight'); el.removeEventListener('animationend', handler); }
          });
          document.documentElement._smoothWheelStop?.();
          var r = el.getBoundingClientRect();
          var targetY = Math.max(0, window.scrollY + r.top - (window.innerHeight / 2) + (r.height / 2));
          document.documentElement.scrollTop = targetY;
        }
      }
    }
    updateNotifBadge();
  }

  function checkOverdueNotifs() {
    tasks.forEach(function(t) {
      if (t.done) return;
      if (isOverdue(t.date, t.time)) addNotif('overdue', t.id, '⏰', 'Просроченная задача', t.title.length > 50 ? t.title.slice(0,50) + '…' : t.title);
    });
  }

  function checkChangelogNotif() {
    var last = localStorage.getItem('plandaily_last_version');
    var cur = CHANGELOG[0].version;
    if (last !== cur) {
      addNotif('changelog', cur, '📋', 'Обновление PlanDaily ' + cur, 'Вышла новая версия — нажмите, чтобы посмотреть изменения');
      localStorage.setItem('plandaily_last_version', cur);
    }
  }

  // ==== Performance Detection ====
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
      (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4)) {
    document.body.classList.add('perf-low');
  }

  checkChangelogNotif();
  checkOverdueNotifs();
  updateNotifBadge();

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.notif-dropdown') && !e.target.closest('#notifBtn')) closeNotifDropdown();
  });

  try { navigator.serviceWorker?.register('sw.js', { scope: './' }).catch(function(){}); } catch(e) {}
</script>
